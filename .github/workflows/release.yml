name: Release EventKit

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty for auto)"
        required: false
        type: string
      snapshot:
        description: "Publish as snapshot"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache ~/.bun
        id: cache-bun
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run build

      - name: Get package version
        id: version
        run: |
          # Use manual version if provided, otherwise use package.json
          if [ "${{ inputs.version }}" != "" ]; then
            VERSION="${{ inputs.version }}"
            echo "Using manual version: $VERSION"
          elif [ "${{ inputs.snapshot }}" == "true" ]; then
            VERSION="0.0.0-$(date +%Y%m%d%H%M%S)"
            echo "Using snapshot version: $VERSION"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "Using package.json version: $VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version exists on npm
        id: npm_check
        run: |
          NPM_VERSION=$(bun pm ls @divmode/eventkit --all 2>/dev/null | grep @divmode/eventkit@ | head -1 | sed 's/.*@//' || echo "0.0.0")
          CURRENT_VERSION="${{ steps.version.outputs.version }}"

          if [ "$NPM_VERSION" != "$CURRENT_VERSION" ]; then
            echo "publish_needed=true" >> $GITHUB_OUTPUT
            echo "Package version $CURRENT_VERSION is new (npm has $NPM_VERSION)"
          else
            echo "publish_needed=false" >> $GITHUB_OUTPUT
            echo "Package version $CURRENT_VERSION already exists on npm"
          fi

      - name: Check if release exists
        id: release_exists
        if: steps.npm_check.outputs.publish_needed == 'true' && inputs.snapshot != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ${{ steps.version.outputs.tag }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json version if needed
        if: steps.npm_check.outputs.publish_needed == 'true' && (inputs.version != '' || inputs.snapshot == true)
        run: |
          # Update version in package.json if using manual or snapshot version
          bun run -c "const pkg = require('./package.json'); pkg.version = '${{ steps.version.outputs.version }}'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n')"

      - name: Setup Node.js for npm OIDC
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # NO registry-url - it sets NODE_AUTH_TOKEN which blocks OIDC

      - name: Install latest npm for OIDC support
        run: npm install -g npm@latest

      - name: Debug npm version
        run: npm --version

      - name: Publish to npm (OIDC)
        if: steps.npm_check.outputs.publish_needed == 'true'
        run: |
          if [ "${{ inputs.snapshot }}" == "true" ]; then
            npm publish --access public --tag snapshot
          else
            npm publish --access public --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ''  # Clear to allow OIDC

      - name: Create GitHub release
        if: steps.npm_check.outputs.publish_needed == 'true' && steps.release_exists.outputs.exists == 'false' && inputs.snapshot != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get previous release tag
          PREVIOUS_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            # Generate filtered release notes
            COMMITS=$(git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD -- packages/eventkit/ | \
              grep -v -i "^- release:" | \
              grep -v -i "^- ignore:" | \
              grep -v -i "^- chore:" | \
              grep -v -i "^- ci:" | \
              grep -v -i "^- docs:" | \
              grep -v -i "^- doc:" | \
              grep -v -i "^- wip:" || echo "")

            if [ -z "$COMMITS" ]; then
              COMMITS="No notable changes"
            fi
          else
            COMMITS="Initial release"
          fi

          gh release create ${{ steps.version.outputs.tag }} \
            --title "EventKit v${{ steps.version.outputs.version }}" \
            --notes "$COMMITS"